<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCS Inmobiliaria – Presentación</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#FFC22B;--m:#b8b8b8;--c:#111;--l:#2a2a2a;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding:calc(6vh + env(safe-area-inset-top,0px)) 6vw calc(11vh + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;background:radial-gradient(circle at 85% 5%,#1d1606 0,#000 55%);font-size:calc(var(--k,1)*clamp(10px,min(1.9vw,3.3vh),22px))}
.slide.on{opacity:1;visibility:visible}
.in{margin:auto 0;width:100%}
.ph{position:absolute;top:calc(2.5vh + env(safe-area-inset-top,0px));left:6vw;color:var(--g);letter-spacing:.2em;text-transform:uppercase;font-size:.7em}
h2{font-family:'Playfair Display',serif;color:var(--g);font-size:2.6em;line-height:1.1;margin-bottom:.35em}
h2::after{content:"";display:block;height:.1em;width:0;background:var(--g);margin-top:.25em;transition:width 1s .5s}
.on h2::after{width:2.5em}
h3{font-family:'Playfair Display',serif;font-size:1.2em;margin-bottom:.2em}
p,li{color:var(--m);font-weight:300;line-height:1.5;font-size:1em}
p{margin:.5em 0}
b{color:#fff;font-weight:600}
ul{list-style:none}li{margin:.3em 0}li::before{content:"◆ ";color:var(--g);font-size:.7em}
.r{opacity:0;transform:translateY(1.5em) scale(.96);transition:opacity .6s,transform .6s}
.on .r{opacity:1;transform:none;transition-delay:calc(var(--i,0)*.1s + .6s)}
.grid{display:grid;gap:.9em;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));margin:.6em 0}
.card{background:var(--c);border:1px solid var(--l);border-top:.2em solid var(--g);border-radius:.7em;padding:1em}
.tag{display:inline-block;background:var(--g);color:#000;border-radius:.4em;padding:.1em .6em;margin-bottom:.4em;font-size:.8em}
.big{text-align:center}.n{display:block;font-family:'Playfair Display',serif;color:var(--g);font-size:2.6em;line-height:1}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;margin:.8em 0}
.nd{background:var(--g);color:#000;font-weight:600;border-radius:.5em;padding:.5em .9em}
.ar{color:var(--g);font-size:1.5em;animation:pl 1.4s infinite}
@keyframes pl{50%{transform:translateX(.4em)}}
.bars{margin:.6em 0}.br{display:grid;grid-template-columns:8em 1fr 2em;align-items:center;gap:.6em;margin:.4em 0}
.br i{height:1em;border-radius:.5em;background:linear-gradient(90deg,var(--g),#fff);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.on .br i{width:var(--w);transition-delay:calc(var(--i,0)*.12s + .8s)}
.br em{color:var(--g);font-style:normal;font-weight:600}
.cover{align-items:center;text-align:center}.cover .in{display:flex;flex-direction:column;align-items:center}
.logo{height:34vh;max-width:80vw;object-fit:contain;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-.5em)}}
.cover h1{font-family:'Playfair Display',serif;font-size:1.9em;max-width:20em;margin:.2em 0}
.chip{display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:2em;padding:.2em .9em;margin:.2em;font-size:.85em}
.mini{position:fixed;top:calc(1.5vh + env(safe-area-inset-top,0px));right:4vw;height:7vh;z-index:5}
.nav{position:fixed;left:0;right:0;bottom:calc(2vh + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:1em;z-index:5;font-size:14px;color:var(--m)}
.nav button{background:none;border:1px solid var(--g);color:var(--g);width:2.6em;height:2.6em;border-radius:50%;cursor:pointer}
.nav button:hover{background:var(--g);color:#000}
.bar{position:fixed;top:0;left:0;height:3px;background:var(--g);transition:width .6s;z-index:30}
#tr{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden;display:none}
#tr.go{display:block}#tr div{position:absolute;display:none}
.t1 .a{display:block;inset:0;background:var(--g);animation:c1 1.1s ease-in-out forwards}
@keyframes c1{0%{clip-path:circle(0% at 50% 50%)}45%,80%{clip-path:circle(75% at 50% 50%)}100%{clip-path:circle(0% at 50% 50%)}}
.t2 .b{display:block;top:0;height:100%;width:17%;background:var(--g);transform:translateY(-101%);animation:c2 1.1s ease-in-out forwards;animation-delay:calc(var(--j)*.05s)}
.t2 .b:nth-child(even){background:#fff}
@keyframes c2{0%{transform:translateY(-101%)}35%,75%{transform:translateY(0)}100%{transform:translateY(101%)}}
.t3 .c{display:block;inset:-10% -20%;background:linear-gradient(90deg,#fff 0 18%,var(--g) 18% 82%,#000 82%);transform:translateX(-110%) skewX(-15deg);animation:c3 1.1s ease-in-out forwards}
@keyframes c3{0%{transform:translateX(-110%) skewX(-15deg)}40%,80%{transform:translateX(0) skewX(-15deg)}100%{transform:translateX(110%) skewX(-15deg)}}
</style></head><body>

<script>
const p=t=>`<p class="r">${t}</p>`,li=a=>`<ul>${a.map(x=>`<li class="r">${x}</li>`).join('')}</ul>`,
cd=(t,x,b)=>`<div class="card r">${b?`<b class="tag">${b}</b>`:''}<h3>${t}</h3>${x.startsWith('<ul')?x:`<p>${x}</p>`}</div>`,
g=a=>`<div class="grid">${a.join('')}</div>`,
fl=a=>`<div class="flow r">${a.map(x=>x==='>'?'<span class="ar">➜</span>':`<span class="nd">${x}</span>`).join('')}</div>`,
num=(n,l)=>`<div class="card r big"><b class="n" data-n="${n}">0</b><p>${l}</p></div>`,
bars=a=>`<div class="bars">${a.map(([l,v],i)=>`<div class="br r" style="--w:${v*100/14}%;--i:${i}"><span>${l}</span><i></i><em>${v}</em></div>`).join('')}</div>`,
ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const F1='Fase 1 · Formulación',F2='Fase 2 · Modelo conceptual',F3='Fase 3 · Relacional y normalización',F4='Fase 4 · PostgreSQL',F5='Fase 5 · Optimización y transacciones',F6='Fase 6 · MongoDB',F7='Cierre';
const S=[
{cover:1},
{ph:F1,t:'El problema',h:p('La inmobiliaria tenía propiedades, campañas, prospectos y seguimientos en archivos separados.')+g([cd('Duplicados','Prospectos y propiedades repetidos.'),cd('Historial incompleto','Contactos sin trazabilidad.'),cd('Campañas sueltas','Sin relación clara con las oportunidades que generaban.')])+p('Buscamos una base que deje trazado <b>quién</b> se interesó, <b>en qué inmueble</b>, <b>por qué campaña</b>, qué seguimiento hubo y <b>cómo cerró</b>.')},
{ph:F1,t:'Alcance y reglas',h:g([cd('Incluimos','Propiedades, prospectos, campañas, visitas, ofertas y cierres.'),cd('Dejamos fuera','Contabilidad, nómina, trámites jurídicos y automatización de WhatsApp.')])+g([cd('La solicitud une prospecto y propiedad; el dueño va aparte.','','R6'),cd('La campaña en la solicitud es opcional.','','R10'),cd('Solo se cierra una oferta aceptada.','','R12'),cd('La comisión se calcula, no se digita.','','R16')].map(x=>x.replace('<p></p>','')))},
{ph:F1,t:'Lo que la base debe responder',h:p('Diez preguntas. Tres ejemplos:')+li(['Qué propiedades están disponibles, a qué precio y en qué ciudad.','Qué campañas y canales trajeron más oportunidades.','Qué propiedades llevan más tiempo publicadas sin un cierre.'])+p('<b>Esas preguntas son el contrato de las consultas SQL.</b>')},
{ph:F2,t:'Qué modelamos',h:p('<b>Diez entidades de proceso:</b>')+'<div class="r">'+['personas','propiedades','dueños','publicaciones','campañas','solicitudes','visitas','ofertas','transacciones','empleados'].map(x=>`<span class="chip">${x}</span>`).join('')+'</div>'+p('Los catálogos (ciudades, tipos de inmueble, canales, roles) evitan texto libre.')+p('Construcción y terreno son detalles opcionales de la propiedad: una casa puede tener los dos; un lote, solo terreno.')},
{ph:F2,t:'La decisión de R6',h:p('La solicitud no apunta al dueño.')+fl(['Persona interesada','>','solicitudes_propiedad','>','Propiedad'])+fl(['Dueño','>','propiedad_propietarios','>','Propiedad'])+p('Una persona puede ser dueña de un inmueble y prospecto de otro. <b>Esos papeles no se mezclan.</b>')},
{ph:F2,t:'Cardinalidades que importan',h:g([cd('Propiedad','Uno o más dueños.','1 → 1..N'),cd('Solicitud','Cero o muchas visitas; cada visita pertenece a una sola solicitud.','1 → 0..N'),cd('Oferta','Nace de una solicitud y tiene como máximo un cierre.','1 → 0..1'),cd('Campaña ↔ Propiedad','Muchos a muchos: en el conceptual es una línea, no una tabla.','N : M')])},
{ph:F3,t:'De 21 cajas a 24 tablas',h:'<div class="grid">'+num(21,'cajas en el conceptual')+num(24,'tablas en BD_MCS v1.3 (igual al script)')+'</div>'+p('Tres muchos a muchos pasaron a tablas puente:')+fl(['persona_roles','publicacion_canales','campana_propiedades'])+p('propiedad_propietarios ya era entidad: el dueño tiene identidad propia.')},
{ph:F3,t:'1FN a BCNF',h:g([cd('1FN','Nada de listas en una celda: “Ana, Luis” serían filas en un puente.'),cd('2FN','El nombre del dueño vive en personas, no en el puente.'),cd('3FN','Ciudad, canal y rol no se copian: se consultan con JOIN. La visita llega a la propiedad por la solicitud.'),cd('BCNF','Cada determinante es una llave. No partimos tablas que ya cumplían.')])+p('<b>comision_valor</b> se calcula en PostgreSQL con el valor final y el porcentaje.')},
{ph:F3,t:'Llaves del proceso',h:p('<b>solicitud_id</b> identifica la oportunidad y arma la cadena:')+fl(['solicitud_id','>','visitas / ofertas','>','transacciones.oferta_id'])+g([cd('Matrícula','La matrícula inmobiliaria es única, además del propiedad_id.'),cd('Campaña','campana_id en la solicitud puede quedar vacío.')])},
{ph:F4,t:'Cómo quedó armada la base',h:p('Sobre <b>inmobiliaria_mcs</b> (el primero se corre en postgres):')+fl(['1 Crear la base','>','2 24 tablas, restricciones, función y triggers','>','3 Datos de prueba','>','4 Vistas y 10 consultas'])+'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(6em,1fr))">'+num(55,'personas')+num(52,'propiedades')+num(65,'solicitudes')+num(88,'visitas')+num(61,'ofertas')+num(18,'transacciones')+'</div>'},
{ph:F4,t:'Consultas y reglas en el motor',h:p('<b>3 vistas:</b> inventario disponible, pipeline activo y resultado de cierres. Las 10 preguntas usan <span class="chip">JOIN</span><span class="chip">HAVING</span><span class="chip">subconsulta</span><span class="chip">CTE</span><span class="chip">RANK()</span>')+p('<b>Triggers que cuidan el negocio:</b>')+li(['El dueño no puede ser prospecto de su misma propiedad.','Una oferta aceptada pasa la propiedad a negociación.','Un cierre exige oferta aceptada, marca la solicitud ganada y actualiza el inmueble.'])+p('Respaldo: inmobiliaria_mcs_f4.sql')},
{ph:F4,t:'Tres resultados',h:g([num(31,'Pregunta 1: publicaciones vigentes, con ciudad y precio.'),num(12,'Pregunta 6: campañas; la de más oportunidades tiene 8.'),num(972,'Pregunta 9: días de la propiedad más antigua sin cierre (rango 1).')])},
{ph:F5,t:'Qué medimos',h:p('Consulta <b>7</b> (prospectos, visitas y ofertas por inmueble) y consulta <b>9</b> (antigüedad sin cierre).')+p('<b>Hipótesis:</b> faltaban índices en las columnas de unión de solicitudes, visitas, ofertas y transacciones. En PostgreSQL la llave foránea no crea ese índice sola.')+'<div class="grid">'+cd('Resultado','Con esta carga todas las ejecuciones quedaron bajo <b>0,5 ms</b>.')+'</div>'},
{ph:F5,t:'Al indexar y al reescribir',h:g([cd('Consulta 7','Seq Scan: 0,298 ms ➜ 0,428 ms. Con tablas pequeñas el motor lee todo; los índices quedan para miles de filas.'),cd('Consulta 9 original','0,352 ms ➜ 0,264 ms tras los índices.'),cd('Reescrita con NOT EXISTS','Hash Anti Join y menos tiempo de planificación. Es la versión de la pregunta 9.')])},
{ph:F5,t:'El cierre es una sola transacción',h:p('<b>registrar_cierre</b> inserta en transacciones; el trigger, en la misma transacción:')+fl(['Exige oferta aceptada','>','Solicitud ganada','>','Propiedad vendida / no disponible'])+g([cd('Oferta 16: COMMIT','La propiedad 3 quedó vendida y la solicitud ganada.'),cd('Oferta 1 (pendiente)','Cierre rechazado: no queda fila en transacciones.')])+p('Con dos sesiones sobre el mismo inmueble, <b>cerrar_venta_con_bloqueo</b> toma la fila con FOR UPDATE y la segunda espera. Aislamiento: READ COMMITTED + bloqueo.')},
{ph:F6,t:'Qué no metimos en PostgreSQL',h:g([cd('PostgreSQL','Visitas: fecha, duración y calificación.'),cd('MongoDB · seguimiento_eventos','WhatsApp, llamadas, correos, notas y ferias no comparten columnas: mensaje = texto, llamada = duración, nota = prioridad.')])+p('No copiamos personas ni propiedades: guardamos <b>solicitud_id, persona_id y propiedad_id</b> para cruzar con PostgreSQL.')},
{ph:F6,t:'Carga, índices y CRUD',h:'<div class="grid">'+num(36,'eventos cargados')+'</div>'+bars([['WhatsApp',14],['Llamada',7],['Nota interna',7],['Correo',6],['Feria',2]])+p('<b>Índices:</b> solicitud + fecha (línea de tiempo) y canal + fecha (agrupar por canal). El CRUD inserta, lee, actualiza y borra un evento: la colección vuelve a 36.')},
{ph:F6,t:'Dos agregaciones',h:g([cd('Eventos por canal','WhatsApp concentra la actividad.'),cd('Oportunidades con más interacciones','La solicitud 2, propiedad 1, tiene 3. El resto del top tiene 2.')])+p('Complementan el seguimiento y las campañas. Las visitas siguen contándose en SQL.')},
{ph:F7,t:'Qué entregamos',h:p('Un hilo continuo:')+fl(['Problema','>','Modelo conceptual','>','24 tablas BCNF','>','PostgreSQL + 10 consultas'])+fl(['Medición de 2 planes','>','Cierre transaccional','>','Historial en MongoDB'])},
{ph:F7,t:'Límites que asumimos',h:li(['Una persona tiene un teléfono y un correo.','Los empleados no están dentro de personas.','Con pocas filas, los índices no cambian el plan de la consulta 7.','MongoDB y PostgreSQL se cruzan por identificadores; no hay llave foránea entre motores.'])},
{ph:F7,t:'Para mostrar si lo piden',h:li(['Regla R6 en el diagrama y en solicitudes_propiedad.','Consulta de inventario, de campañas o de antigüedad sin cierre.','EXPLAIN de la consulta 7: Seq Scan y por qué el índice igual se justifica.','COMMIT de la oferta 61 (propiedad 22) y rechazo de la oferta 1.','Colección seguimiento_eventos y conteo por canal.'])}
];

const E=[...D.children];E.forEach(e=>e.querySelectorAll('.r').forEach((x,i)=>{if(!x.style.getPropertyValue('--i'))x.style.setProperty('--i',i)}));
function fit(){E.forEach(e=>{let k=1;e.style.setProperty('--k',1);while(e.scrollHeight>e.clientHeight+1&&k>.4){k-=.04;e.style.setProperty('--k',k)}})}
let c=0,busy=0;const T=document.getElementById('tr');
function show(n){c=n;E.forEach((e,i)=>e.classList.toggle('on',i===n));ct.textContent=(n+1)+' / '+E.length;bar.style.width=(n+1)/E.length*100+'%';mini.style.display=n?'block':'none';
E[n].querySelectorAll('.n').forEach(el=>{const t=+el.dataset.n,s=performance.now();(function f(now){const q=Math.min(1,(now-s)/1200);el.textContent=Math.round(t*(1-Math.pow(1-q,3)));if(q<1)requestAnimationFrame(f)})(s)})}
function go(n){n=Math.max(0,Math.min(E.length-1,n));if(busy||n===c)return;busy=1;T.className='go t'+(n%3+1);setTimeout(()=>show(n),720);setTimeout(()=>{T.className='';busy=0},1400)}
nx.onclick=()=>go(c+1);pv.onclick=()=>go(c-1);
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))go(c+1);if(['ArrowLeft','PageUp'].includes(e.key))go(c-1)});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(c+(d<0?1:-1))});
addEventListener('resize',fit);fit();show(0);document.fonts&&document.fonts.ready.then(fit);
